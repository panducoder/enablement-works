  group: "Working with a partner"
  link: "/guides/sales-enablement-roadmap/"

- q: "How much of our time does working with Enablement Works take?"
  a: "In the first 30 days, expect about 3 to 4 hours of the CRO's time and 2 to 3 hours a week from the head of enablement. Managers and reps give 30 to 45 minutes each for interviews. After that, it is a 30-minute work review every one or two weeks and a 15-minute CRO report each month."
  group: "Working with a partner"
  link: "/guides/outsourced-sales-enablement/"
